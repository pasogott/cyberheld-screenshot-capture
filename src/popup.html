<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Capture</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 20px 0;
            color: #333;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: 500;
        }

        .status.inactive {
            background-color: #f0f0f0;
            color: #666;
        }

        .status.active {
            background-color: #e8f5e8;
            color: #2d5a2d;
        }

        .status.error {
            background-color: #ffeaea;
            color: #d32f2f;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .start-btn {
            background-color: #4CAF50;
            color: white;
        }

        .start-btn:hover {
            background-color: #45a049;
        }

        .stop-btn {
            background-color: #f44336;
            color: white;
        }

        .stop-btn:hover {
            background-color: #da190b;
        }

        .options-btn {
            background-color: #2196F3;
            color: white;
            margin-top: 10px;
        }

        .options-btn:hover {
            background-color: #1976D2;
        }

        .reset-btn {
            background-color: #FF9800;
            color: white;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background-color: #F57C00;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Screenshot Capture</h1>

        <div id="status" class="status inactive">
            Bereit zum Starten
        </div>

        <button id="startBtn" class="start-btn">
            🚀 Capture starten
        </button>

        <button id="stopBtn" class="stop-btn" style="display: none;">
            ⏹️ Capture stoppen
        </button>

        <button id="optionsBtn" class="options-btn">
            ⚙️ Einstellungen
        </button>

        <button id="resetBtn" class="reset-btn" style="display: none;">
            🔄 Zurücksetzen
        </button>

        <div class="info">
            <strong>Hinweis:</strong> Wähle zuerst einen Zielordner in den Einstellungen aus.
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
